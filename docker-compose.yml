services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      CCARF_ENVIRONMENT: production
      CCARF_SECRET_KEY: ${CCARF_SECRET_KEY:?Set CCARF_SECRET_KEY before running in any shared environment}
      CCARF_CORS_ORIGINS: ${CCARF_CORS_ORIGINS:-http://localhost:5173}
      CCARF_FIRST_ADMIN_EMAIL: ${CCARF_FIRST_ADMIN_EMAIL:-}
      CCARF_FIRST_ADMIN_PASSWORD: ${CCARF_FIRST_ADMIN_PASSWORD:-}
    volumes:
      - ccarf-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ccarf-data:
